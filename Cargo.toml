[package]
name = "lottery-dlt"
version = "1.9.0"
edition = "2021"
rust-version = "1.94"
description = "体彩大乐透选号、对奖与严格滚动回测，纯 Rust 服务"
license = "MIT"

[lib]
name = "lottery_dlt"

[[bin]]
name = "lottery-dlt"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.102"
axum = "=0.8.9"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "=4.6.1", features = ["derive", "env"] }
csv = "1.3"
hex = "0.4"
rand = "0.8"
rand_chacha = "0.3"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
